
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Roadmap Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px #ccd3e0;
    }
    h1 { color: #3347b0; text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #4255c7;
      color: white;
      border: none;
      margin-top: 22px;
      cursor: pointer;
    }
    #result { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Career Roadmap Generator</h1>
    <p>Create your personal career roadmap.</p>
    <form id="careerForm">
      <label>Your Name</label>
      <input id="name" placeholder="Enter your name" required>
      <label>Career Goal</label>
      <input id="goal" placeholder="e.g. Python Developer" required>
      <label>Current Skills</label>
      <input id="skills" placeholder="e.g. Python, HTML, CSS">
      <label>Experience Level</label>
      <select id="level">
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
      <button type="submit">Generate Roadmap</button>
    </form>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById("careerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const result = document.getElementById("result");
      result.textContent = "Generating your roadmap...";
      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            name: document.getElementById("name").value,
            goal: document.getElementById("goal").value,
            skills: document.getElementById("skills").value,
            level: document.getElementById("level").value
          })
        });
        const data = await response.json();
        result.textContent = data.success
          ? "Your career roadmap request was received!\n\n" + JSON.stringify(data.roadmap, null, 2)
          : "Could not generate roadmap.";
      } catch (error) {
        result.textContent = "Error connecting to the server. Please try again.";
      }
    });
  </script>
</body>
</html>
